services:
  couchdb:
    image: couchdb:latest
    container_name: couchdb-obsidian
    user: 1000:1000
    environment:
      COUCHDB_USER: ${COUCHDB_USER}
      COUCHDB_PASSWORD: ${COUCHDB_PASSWD}
    volumes:
      - /mnt/obsidian/couchdb-data:/opt/couchdb/data
      - /mnt/obsidian/couchdb-etc:/opt/couchdb/etc/local.d
        #- ./obsidian/couchdb-data:/opt/couchdb/data
        #- ./obsidian/couchdb-etc:/opt/couchdb/etc/local.d
    ports:
      - 5984:5984
    restart: always

volumes:
  couchdb-data:
  couchdb-config:

networks:
  obsidian-network:
    driver: bridge

